syntax="proto3";
package auth;
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dinhcanh303/go-microservice/proto/gen";

service AuthService {
    rpc SignIn(SignInRequest) returns (SignInResponse){
        option (google.api.http) = {
            post: "/v1/signin",
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "SignIn application"
            description: ""
        };
    }
    rpc SignUp(SignUpRequest) returns (SignUpResponse){
        option (google.api.http) = {
            post: "/v1/signup",
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "SignUp application"
            description: ""
        };
    }
    // rpc Logout(LoginRequest) returns (LoginResponse){
    //     option (google.api.http) = {
    //         post: "/v1/api/logout",
    //         body: "*"
    //     };
    //     option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
    //         summary: "Logout application"
    //         description: ""
    //     };
    // }
    // rpc HandleRefreshToken(LoginRequest) returns (LoginResponse){
    //     option (google.api.http) = {
    //         post: "/v1/api/handle-refresh-token",
    //         body: "*"
    //     };
    //     option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
    //         summary: "HandleRefreshToken application"
    //         description: ""
    //     };
    // }
    
}

message SignInRequest{
    string email = 1;
    string password = 2;
}

message SignInResponse{
    User user =1;
    string access_token = 2;
    string refresh_token = 3;
}
message SignUpRequest{
    string email = 1;
    string password = 2;
    string first_name = 3;
    string last_name = 4;
}

message SignUpResponse{
    User user =1;
    string access_token = 2;
    string refresh_token = 3;
}
message User {
    string id = 1;
    string email = 2;
    string first_name = 3;
    string last_name = 4;
    string full_name = 5;
    google.protobuf.Timestamp created_at = 6;
    google.protobuf.Timestamp updated_at = 7;
}