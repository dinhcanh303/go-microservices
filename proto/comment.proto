syntax="proto3";

package comment;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/timestamp.proto";
import "like.proto";
import "upload.proto";

option go_package = "github.com/dinhcanh303/go-microsevices/proto/gen";

service CommentService {
    rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse){
        option (google.api.http) = {
            post: "/v1/api/comments"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Create Comment"
            description: ""
        };
    }
    rpc GetComment(GetCommentRequest) returns (GetCommentResponse){
        option (google.api.http) = {
            get: "/v1/api/comments/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get Comment"
            description: ""
        };
    }
    rpc UpdateComment(UpdateCommentRequest) returns (UpdateCommentResponse){
        option (google.api.http) = {
            put: "/v1/api/comments/{comment.id}"
            body: "*"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Update Comment"
            description: ""
        };
    }
    rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse){
        option (google.api.http) = {
            delete: "/v1/api/comments/{id}"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Delete Comment"
            description: ""
        };
    }
    rpc GetCommentsByPostID(GetCommentsByPostIDRequest) returns (GetCommentsByPostIDResponse){
        option (google.api.http) = {
            get: "/v1/api/posts/{post_id}/comments"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get Comment By Post ID"
            description: ""
        };
    }
    rpc CountCommentByCommentID(CountCommentByCommentIDRequest) returns (CountCommentByCommentIDResponse){
        option (google.api.http) = {
            get: "/v1/api/comments/{id}/count"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Count Comment By Comment ID"
            description: ""
        };
    }
}


message CreateCommentRequest {
    CommentRequest comment =1;
}
message CreateCommentResponse {
    Comment comment = 1;
}
message GetCommentRequest {
    string id = 1;
}
message GetCommentResponse {
    Comment comment = 1;
}
message UpdateCommentRequest {
    Comment comment = 1;
}
message UpdateCommentResponse {
    Comment comment = 1;
}
message DeleteCommentRequest {
    string id = 1;
}
message DeleteCommentResponse {
    bool deleted = 1;
}
message GetCommentsByPostIDRequest {
    string post_id =1;
}
message CountCommentByCommentIDRequest {
    string id = 1;
}
message CountCommentByCommentIDResponse {
    int64 count = 1;
}
message GetCommentsByPostIDResponse {
    repeated CommentHasCommentAndLike comments = 1;
}
message CommentRequest {
    string post_id = 1;
    string user_id = 2;
    string reply_to_id = 3;
    string content = 4;
    string parent_comment_id = 5;
}
message Comment {
    string id = 1;
    string post_id = 2;
    string user_id = 3;
    string reply_to_id = 4;
    string content = 5;
    string parent_comment_id = 6;
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
}
message CommentHasLike {
    string id = 1;
    string post_id = 2;
    string user_id = 3;
    string reply_to_id = 4;
    string content = 5;
    string parent_comment_id = 6;
    repeated like.Like likes = 7;
    repeated upload.Attachment attachments = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
}
message CommentHasCommentAndLike {
    string id = 1;
    string post_id = 2;
    string user_id = 3;
    string reply_to_id = 4;
    string content = 5;
    string parent_comment_id = 6;
    repeated CommentHasLike children = 7;
    repeated like.Like likes = 8;
    repeated upload.Attachment attachments = 9;
    google.protobuf.Timestamp created_at = 10;
    google.protobuf.Timestamp updated_at = 11;
}