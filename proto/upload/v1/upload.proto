syntax="proto3";

package upload.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/dinhcanh303/go-microservices/api/upload/v1";

service UploadService {
    rpc GetAttachmentsByType(GetAttachmentsByTypeRequest) returns (GetAttachmentsByTypeResponse) {
        option (google.api.http) = {
            get: "/api/v1/attachments"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get Attachments By Type"
            description: ""
        };
    }
    rpc GetAttachmentsByOptional(GetAttachmentsByOptionalRequest) returns (GetAttachmentsByOptionalResponse) {
        option (google.api.http) = {
            get: "/api/v1/optional/attachments"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get Attachments By Optional"
            description: ""
        };
    }
    rpc GetAvatarUser(GetAvatarUserRequest) returns (GetAvatarUserResponse) {
        option (google.api.http) = {
            get: "/api/v1/users/{id}/avatar"
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get Avatar User"
            description: ""
        };
    }
}
message GetAttachmentsByTypeRequest{
    string attachable_type = 1;
    string attachable_id = 2;
}

message GetAttachmentsByTypeResponse{
    repeated Attachment attachments = 1;
}
message GetAttachmentsByOptionalRequest{
    string attachable_type = 1;
    string user_id = 2;
    string mime_type = 3;
    string entity_upload_id = 4;
    int32 limit = 5;
    int32 offset = 6;
}

message GetAttachmentsByOptionalResponse{
    repeated Attachment attachments = 1;
}
message GetAvatarUserRequest{
    string id = 1;
}
message GetAvatarUserResponse{
    Attachment attachment = 1;
}

message Attachment {
    string id = 1;
    string attachable_type = 2;
    string attachable_id = 3;
    string entity_upload_id = 4;
    string user_id = 5;
    string filename = 6;
    string extension = 7;
    string mime_type = 8;
    string folder = 9;
    string url = 10;
    string url_thumbnail = 11;
    google.protobuf.Timestamp created_at = 12;
    google.protobuf.Timestamp updated_at = 13;
}