version: "3"

services:
  traefik:
    image: traefik:v2.10.5
    container_name: mcs-traefik
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/:/etc/traefik/
      - ./certs/:/path/to/
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    networks:
      - mcs-network
      - inbound
  
  jaeger:
    container_name: jaeger_container
    restart: unless-stopped
    image: jaegertracing/all-in-one:1.21
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
      - 14268:14268
      - 14250:14250
      - 9411:9411
    networks:
      - inbound

networks:
    mcs-network:
      name: mcs-network
      external: true
    inbound:
      driver: bridge
      name: inbound