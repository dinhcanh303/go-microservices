version: "3"

services:
  traefik:
    image: traefik:v2.10.5
    container_name: mcs-traefik
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./configs/:/etc/traefik/
      - ./certs/:/path/to/
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    networks:
      - mcs-network
      - inbound
  prometheus:
    image: prom/prometheus
    container_name: mcs-prometheus
    volumes:
      - ./plugins/prometheus/:/etc/prometheus/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - inbound
    ports:
      - "9090:9090"
    deploy:
      labels:
        - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
        - "traefik.http.routers.prometheus.service=prometheus"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
        - "traefik.docker.network=inbound"
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
  grafana:
    image: grafana/grafana
    container_name: mcs-grafana
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./plugins/grafana/provisioning/:/etc/grafana/provisioning/
    env_file:
      - ./plugins/grafana/config.monitoring
    networks:
      - inbound
    ports:
      - "3000:3000"
    user: "104"
    deploy:
      labels:
        - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
        - "traefik.http.routers.grafana.service=grafana"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.docker.network=inbound"
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
  jaeger:
    container_name: jaeger_container
    restart: always
    image: jaegertracing/all-in-one:1.21
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    ports:
      - 5775:5775/udp
      - 6831:6831/udp
      - 6832:6832/udp
      - 5778:5778
      - 16686:16686
      - 14268:14268
      - 14250:14250
      - 9411:9411
    networks:
      - inbound
volumes:
  prometheus_data: {}
  grafana_data: {}

networks:
    mcs-network:
      name: mcs-network
      external: true
    inbound:
      driver: bridge
      name: inbound