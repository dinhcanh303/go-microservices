http:
  routers:
    # font-end:
    #   rule: "Host(`{{env "APP_DOMAIN"}}`)"
    #   service: font-end
    #   tls:
    #     certResolver: certificates
    auth:
      rule: "Host(`{{env "APP_DOMAIN"}}`) && PathPrefix(`/api/v1/auth`)"
      service: auth
      tls:
        certResolver: certificates
    proxy:
      rule: "Host(`{{env "APP_DOMAIN"}}`) && PathPrefix(`/api/v1`)"
      middlewares:
        - corsHeader
        - auth
      service: proxy
      tls:
        certResolver: certificates
    upload:
      rule: "Host(`{{env "APP_DOMAIN"}}`) && PathPrefix(`/api/v1/attachments`) || PathPrefix(`/api/v1/attachment`) || PathPrefix(`/api/v1/upload`)"
      middlewares:
        - corsHeader
        - auth
      service: upload
      tls:
        certResolver: certificates
  services:
    # font-end:
    #   loadBalancer:
    #     servers:
    #       - url: http://192.168.108.40:5173
    auth:
      loadBalancer:
        servers:
          - url: http://{{env "HOST_PROXY"}}:5000
    proxy:
      loadBalancer:
        servers:
          - url: http://{{env "HOST_PROXY"}}:5000
    upload:
      loadBalancer:
        servers:
          - url: http://{{env "HOST_UPLOAD"}}:5005
  middlewares:
    auth:
      forwardAuth:
        address: "http://{{env "HOST_PROXY"}}:5000/api/v1/auth/verify"
        authResponseHeaders:
          - "Grpc-Metadata-X-Auth-User"
          - "Grpc-Metadata-X-Auth-Keystore"
          - "Grpc-Metadata-X-Auth-Keystore-Used"
        trustForwardHeader: true
    corsHeader:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
          - PATCH
          - POST
          - DELETE
        accessControlAllowHeaders: "*"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 100
        addVaryHeader: true
tls:
  certificates:
    - certFile: /path/to/public.cert
      keyFile: /path/to/private.key