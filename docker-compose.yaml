version: "3"

services:
  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=P@ssw0rd
    healthcheck:
      # test: ["CMD", "pg_isready"]
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - "5432:5432"
    networks:
      - microservices-network
  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - microservices-network

  group:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-group
    image: go-microservices-group
    environment:
      APP_NAME: 'group-service in docker'
      IN_DOCKER: "true"
      PG_URL: postgres://postgres:P@ssw0rd@postgres:5432/postgres
      PG_DSN_URL: host=postgres user=postgres password=P@ssw0rd dbname=postgres sslmode=disable
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - microservices-network

  proxy:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-proxy
    image: go-microservices-proxy
    environment:
      APP_NAME: 'proxy-service in docker'
      GRPC_GROUP_HOST: 'group'
      GRPC_GROUP_PORT: 5001
    ports:
      - "5000:5000"
    depends_on:
      - group
    networks:
      - microservices-network

  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-web
    image: go-microservices-web
    environment:
      REVERSE_PROXY_URL: http://localhost:5000
      WEB_PORT: 8888
    ports:
      - "8888:8888"
    depends_on:
      - proxy
    networks:
      - microservices-network

networks:
  microservices-network:
