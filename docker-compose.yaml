version: "3"

services:
  proxy:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-proxy
    image: go-microservices-proxy
    environment:
      APP_NAME: 'proxy-service in docker'
      GRPC_GROUP_HOST: 'group'
      GRPC_GROUP_PORT: 5001
      GRPC_POST_HOST: 'post'
      GRPC_POST_PORT: 5002
      GRPC_COMMENT_HOST: 'comment'
      GRPC_COMMENT_PORT: 5003
      GRPC_LIKE_HOST: 'like'
      GRPC_LIKE_PORT: 5004
      GRPC_UPLOAD_HOST: 'upload'
      GRPC_UPLOAD_PORT: 5006
    ports:
      - 5000:5000
    depends_on:
      - group
      - post
      - comment
      - like
      - upload
    networks:
      - microservices-network
  group:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-group
    image: go-microservices-group
    environment:
      APP_NAME: 'group-service in docker'
      IN_DOCKER: "true"
      PG_URL: postgres://postgres:P@ssw0rd@postgres:5432/postgres
      PG_DSN_URL: host=postgres user=postgres password=P@ssw0rd dbname=postgres sslmode=disable
    ports:
      - 5001:5001
    depends_on:
      - post
    networks:
      - microservices-network
  post:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-post
    image: go-microservices-post
    environment:
      APP_NAME: 'post-service in docker'
      IN_DOCKER: "true"
      PG_URL: postgres://postgres:P@ssw0rd@postgres:5432/postgres
      PG_DSN_URL: host=postgres user=postgres password=P@ssw0rd dbname=postgres sslmode=disable
      LIKE_CLIENT_URL: like:5004
      COMMENT_CLIENT_URL: comment:5003
      UPLOAD_CLIENT_URL: upload:5006
    ports:
      - 5002:5002
    depends_on:
      - comment
    networks:
      - microservices-network
  comment:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-comment
    image: go-microservices-comment
    environment:
      APP_NAME: 'comment-service in docker'
      IN_DOCKER: "true"
      PG_URL: postgres://postgres:P@ssw0rd@postgres:5432/postgres
      PG_DSN_URL: host=postgres user=postgres password=P@ssw0rd dbname=postgres sslmode=disable
      LIKE_CLIENT_URL: like:5004
      UPLOAD_CLIENT_URL: upload:5006
    ports:
      - 5003:5003
    depends_on:
      - like
    networks:
      - microservices-network
  like:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-like
    image: go-microservices-like
    environment:
      APP_NAME: 'like-service in docker'
      IN_DOCKER: "true"
      PG_URL: postgres://postgres:P@ssw0rd@postgres:5432/postgres
      PG_DSN_URL: host=postgres user=postgres password=P@ssw0rd dbname=postgres sslmode=disable
    ports:
      - 5004:5004
    depends_on:
      - upload
    networks:
      - microservices-network
  upload:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-upload
    image: go-microservices-upload
    env_file:
      - .env
    environment:
      APP_NAME: 'upload-service in docker'
      IN_DOCKER: "true"
      PG_URL: postgres://postgres:P@ssw0rd@postgres:5432/postgres
      PG_DSN_URL: host=postgres user=postgres password=P@ssw0rd dbname=postgres sslmode=disable
    ports:
      - 5005:5005
      - 5006:5006
    networks:
      - microservices-network
  # web:
  #   build:
  #     context: .
  #     dockerfile: ./docker/Dockerfile-web
  #   image: go-microservices-web
  #   environment:
  #     REVERSE_PROXY_URL: http://localhost:5000
  #     WEB_PORT: 8888
  #   ports:
  #     - 8888:8888
  #   depends_on:
  #     - proxy
  #   networks:
  #     - microservices-network


networks:
  postgres:
    external: true
    name: postgres
  rabbitmq:
    external: true
    name: rabbitmq
  redis:
    external: true
    name: redis
  microservices-network:
    driver: bridge
