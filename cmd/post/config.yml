app:
  name: 'post-service'
  version: '1.0.0'

http:
  host: '0.0.0.0'
  port: 5003

rabbitmq:
  url: amqp://guest:guest@127.0.0.1:5672/

postgres:
  pool_max: 2
  db_url: postgres://postgres:123456@127.0.0.1:5432/postgres?sslmode=disable
  db_rep_url: postgres://postgres:123456@127.0.0.1:5433/postgres?sslmode=disable

group_client:
  group_url: 0.0.0.0:5002
comment_client:
  comment_url: 0.0.0.0:5004
like_client:
  like_url: 0.0.0.0:5005
upload_client:
  upload_url: 0.0.0.0:5007
auth_client:
  auth_url: 0.0.0.0:5008

logger:
  log_level: 'debug'
  log_dev: true
  log_disable_caller: true
  log_disable_stacktrace: true
  log_encoding: 'console'
  rollbar_env: 'post-service'