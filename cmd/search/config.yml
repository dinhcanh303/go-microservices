app:
  name: 'search-service'
  version: '1.0.0'

http:
  host: '0.0.0.0'
  port: 5008

rabbitmq:
  url: amqp://guest:guest@127.0.0.1:5672/

elasticsearch:
  url: http://localhost:9200
  username: elastic
  password: elastic
meilisearch:
  host: http://localhost:7700
  api_key: ms

product_client:
  url: 0.0.0.0:5001

logger:
  log_level: 'debug'
  log_dev: true
  log_disable_caller: true
  log_disable_stacktrace: true
  log_encoding: 'console'
  rollbar_env: 'search-service'