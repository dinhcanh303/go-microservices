app:
  name: 'auth-service'
  version: '1.0.0'

http:
  host: '0.0.0.0'
  port: 5007

postgres:
  pool_max: 2
  db_url: postgres://postgres:123456@127.0.0.1:5432/postgres?sslmode=disable
  db_rep_url: postgres://postgres:123456@127.0.0.1:5433/postgres?sslmode=disable

upload_client:
  upload_url: 0.0.0.0:5006
group_client:
  group_url: 0.0.0.0:5001
metrics:
  host: '127.0.0.1'
  port: 9090

logger:
  log_level: 'debug'
  log_dev: true
  log_disable_caller: true
  log_disable_stacktrace: true
  log_encoding: 'console'
  rollbar_env: 'auth-service'