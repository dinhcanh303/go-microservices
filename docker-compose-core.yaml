  # schema-registry:
  #   image: confluentinc/cp-schema-registry:7.9.0
  #   container_name: mcs-schema-registry
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     SCHEMA_REGISTRY_HOST_NAME: schema-registry
  #     SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
  #     SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: mcs-kafdrop
    depends_on:
      - kafka1
    ports:
      - "9123:9123"
    environment:
      SERVER_PORT: 9123
      MANAGEMENT_SERVER_PORT: 9123
      KAFKA_BROKERCONNECT: kafka-broker-1:29092 
    networks:
      - mcs-network
  elasticsearch:
    container_name: mcs-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.1
    restart: always
    ports:
      - "9200:9200"
    environment:
      - http.host=0.0.0.0
      - ELASTIC_PASSWORD=123456
      - transport.host=127.0.0.1
      - xpack.security.enabled=false
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - http.cors.enabled=true
      - http.cors.allow-origin="http://localhost:8080"
    networks:
      - mcs-network
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.13.1
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_PASSWORD=123456
    networks:
      - mcs-network
volumes:
  pgm-data: {}
  pgs-data: {}
  redis_data: {}
  mls_data: {}

networks:
    mcs-network:
      driver: bridge
      name: mcs-network



  


