version: "3"

services:
  postgres-master:
    build: ./docker/pg-master
    image: postgres-master
    container_name: mcs-postgres-master
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-slave
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5445:5432
    depends_on:
      - postgres-slave
    volumes:
      - pgm-data:/var/lib/postgresql/data
    networks:
      - mcs-network
  postgres-slave:
    build: ./docker/pg-slave
    image: postgres-slave
    container_name: mcs-postgres-slave
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-master
      - PG_STANDBY=true
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5446:5432
    
    volumes:
      - pgs-data:/var/lib/postgresql/data
    networks:
      - mcs-network
  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: mcs-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - mcs-network
  redis:
    image: redis
    container_name: mcs-redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=password
      - REDIS_REPLICATION_mode=master
    ports:
      - 6379:6379
    networks:
      - mcs-network
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: mcs-redisinsight
    restart: unless-stopped
    volumes:
      - redis_data:/var/lib/redis
    ports:
      - 8002:8001
    networks:
      - mcs-network
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
  #   container_name: mcs-elasticsearch
  #   environment:
  #     - xpack.security.enabled=false
  #     - "discovery.type=single-node"
  #   ports:
  #     - "9200:9200"
  #   networks:
  #     - mcs-network
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: mcs-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${ML_API_KEY:-ms}
    volumes:
      - mls_data:/data.ms
    ports:
      - "7700:7700" # Change ports if needed
    networks:
      - mcs-network
  # mongodb:
  #   image: mongo:latest
  #   container_name: mcs-mongodb
  #   restart: unless-stopped
  #   ports:
  #     - 27017:27017
  #   environment:
  #     - MONGO_INITDB_DATABASE=mongodb
  #     - MONGO_INITDB_ROOT_USERNAME=admin
  #     - MONGO_INITDB_ROOT_PASSWORD=admin
  #   volumes:
  #     - mongodb_data:/data/db
    
  #   networks:
  #     - mcs-network
  zookeeper:
    image:  confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    networks:
      - mcs-network
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT : 2181
      ZOOKEEPER_TICK_TIME : 2000
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    networks:
      - mcs-network
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_CLEANER_DELETE_RETENTION_MS: 5000
      KAFKA_BROKER_ID: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
  connector:
    image: debezium/connect:latest
    container_name: kafka_connect_with_debezium
    networks: 
      - mcs-network
    ports:
      - "8083:8083"
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - zookeeper
      - kafka
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: kafdrop
    networks: 
      - mcs-network
    depends_on:
      - kafka
    ports:
      - 9000:9000
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
  # control-center:
  #   container_name: control-center
  #   image: confluentinc/cp-enterprise-control-center:latest
  #   depends_on:
  #     - kafka
  #     - zookeeper
  #     - connector
  #   ports:
  #     - "9021:9021"
  #   environment:
  #     CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:9092
  #     CONTROL_CENTER_REPLICATION_FACTOR: 1
  #     CONTROL_CENTER_CONNECT_CLUSTER: http://debezium_connect:8083
  #     PORT: 9021

volumes:
  pgm-data: {}
  pgs-data: {}
  redis_data: {}
  mls_data: {}
  # mongodb_data: {}

networks:
    mcs-network:
      driver: bridge
      name: mcs-network