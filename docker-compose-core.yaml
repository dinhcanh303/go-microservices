version: "3"

services:
  postgres-master:
    build: ./docker/pg-master
    container_name: mcs-postgres-master
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-slave
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5445:5432
    volumes:
      - pg-mdata:/var/lib/postgresql/data
    networks:
      - mcs-network
  postgres-slave:
    build: ./docker/pg-slave
    container_name: mcs-postgres-slave
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-master
      - PG_STANDBY=true
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5446:5432
    volumes:
      - pg-sdata:/var/lib/postgresql/data
    networks:
      - mcs-network
  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: mcs-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - mcs-network
  redis:
    image: redis
    container_name: mcs-redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=password
      - REDIS_REPLICATION_mode=master
    ports:
      - 6379:6379
    networks:
      - mcs-network
  redisinsight:
    image: redislabs/redisinsight
    container_name: mcs-redisinsight
    restart: unless-stopped
    volumes:
      - redis_data:/var/lib/redis
    ports:
      - 8002:8001
    networks:
      - mcs-network
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.4.3
  #   container_name: mcs-elasticsearch
  #   environment:
  #     - xpack.security.enabled=false
  #     - "discovery.type=single-node"
  #   ports:
  #     - "9200:9200"
  #   networks:
  #     - mcs-network
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: mcs_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-ms}
    volumes:
      - mls_data:/data.ms
    ports:
      - "7700:7700" # Change ports if needed
    networks:
      - mcs-network

volumes:
  pg-mdata: {}
  pg-sdata: {}
  redis_data: {}
  mls_data: {}

networks:
    mcs-network:
      driver: bridge
      name: mcs-network