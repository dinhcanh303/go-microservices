version: "3"

services:
  postgres-master:
    build: ./docker/pg-master
    image: postgres-master
    container_name: mcs-postgres-master
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-slave
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5445:5432
    depends_on:
      - postgres-slave
    volumes:
      - pgm-data:/var/lib/postgresql/data
    networks:
      - mcs-network
  postgres-slave:
    build: ./docker/pg-slave
    image: postgres-slave
    container_name: mcs-postgres-slave
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-master
      - PG_STANDBY=true
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5446:5432
    
    volumes:
      - pgs-data:/var/lib/postgresql/data
    networks:
      - mcs-network
  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: mcs-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - mcs-network
  redis:
    image: redis
    container_name: mcs-redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=password
      - REDIS_REPLICATION_mode=master
    ports:
      - 6379:6379
    networks:
      - mcs-network
  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: mcs-redisinsight
    restart: unless-stopped
    volumes:
      - redis_data:/var/lib/redis
    ports:
      - 8002:8001
    networks:
      - mcs-network
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: mcs-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${ML_API_KEY:-ms}
    volumes:
      - mls_data:/data.ms
    ports:
      - "7700:7700" # Change ports if needed
    networks:
      - mcs-network
  # mongodb:
  #   image: mongo:latest
  #   container_name: mcs-mongodb
  #   restart: unless-stopped
  #   ports:
  #     - 27017:27017
  #   environment:
  #     - MONGO_INITDB_DATABASE=mongodb
  #     - MONGO_INITDB_ROOT_USERNAME=admin
  #     - MONGO_INITDB_ROOT_PASSWORD=admin
  #   volumes:
  #     - mongodb_data:/data/db
    
  #   networks:
  #     - mcs-network

  zookeeper:
    container_name: mcs-zookeeper
    image: debezium/zookeeper
    ports:
      - 2181:2181
      - 2888:2888
      - 3888:3888
    networks:
      - mcs-network
  kafka:
    container_name: mcs-kafka
    image: debezium/kafka
    ports:
      - 9092:9092
    depends_on:
      - zookeeper
    environment:
      - ZOOKEEPER_CONNECT=zookeeper:2181
    networks:
      - mcs-network
  elasticsearch:
    container_name: mcs-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.1
    restart: always
    ports:
      - "9200:9200"
    environment:
      - http.host=0.0.0.0
      - ELASTIC_PASSWORD=123456
      - transport.host=127.0.0.1
      - xpack.security.enabled=false
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - http.cors.enabled=true
      - http.cors.allow-origin="http://localhost:8080"
    networks:
      - mcs-network
  schema_registry:
    image: confluentinc/cp-schema-registry
    container_name: mcs-schema-registry
    hostname: schema-registry
    restart: always
    depends_on:
      - zookeeper
      - kafka
    ports:
      - 8181:8181
      - 8081:8081
    environment:
      - SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL=zookeeper:2181
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://schema-registry:8081
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=//kafka:9092
    networks:
      - mcs-network
  connect:
    image: debezium/connect:2.5
    ports:
      - "8083:8083"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - KEY_CONVERTER=io.confluent.connect.avro.AvroConverter
      - VALUE_CONVERTER=io.confluent.connect.avro.AvroConverter
      - CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - INTERNAL_KEY_CONVERTER=org.apache.kafka.connect.json.JsonConverter
      - INTERNAL_VALUE_CONVERTER=org.apache.kafka.connect.json.JsonConverter
    networks:
      - mcs-network
  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.13.1
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_PASSWORD=123456
    networks:
      - mcs-network
  control-center:
    container_name: control-center
    image: confluentinc/cp-enterprise-control-center
    depends_on:
      - connect
    ports:
      - 9021:9021
    environment:
      - CONTROL_CENTER_BOOTSTRAP_SERVERS='kafka:9092'
      - CONTROL_CENTER_CONNECT_CONNECT-DEFAULT_CLUSTER='connect:8083'
      - CONTROL_CENTER_REPLICATION_FACTOR=1
      - CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS=1
      - CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS=1
      - CONFLUENT_METRICS_TOPIC_REPLICATION=1
      - PORT=9021
    networks:
      - mcs-network

volumes:
  pgm-data: {}
  pgs-data: {}
  redis_data: {}
  mls_data: {}
  # mongodb_data: {}

networks:
    mcs-network:
      driver: bridge
      name: mcs-network