version: "3"

services:
  postgres-master:
    build: ./docker/pg-master
    image: postgres-master
    container_name: mcs-postgres-master
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-slave
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5445:5432
    depends_on:
      - postgres-slave
    volumes:
      - pgm-data:/var/lib/postgresql/data
    networks:
      - mcs-network
  postgres-slave:
    build: ./docker/pg-slave
    image: postgres-slave
    container_name: mcs-postgres-slave
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=postgres
      - POSTGRES_MASTER=postgres-master
      - PG_STANDBY=true
      - PG_REP_USER=rep
      - PG_REP_PASSWORD=123456
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
    ports:
      - 5446:5432
    
    volumes:
      - pgs-data:/var/lib/postgresql/data
    networks:
      - mcs-network
  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: mcs-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      - mcs-network
  redis:
    image: redis
    container_name: mcs-redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - REDIS_PASSWORD=password
      - REDIS_REPLICATION_mode=master
    ports:
      - 6379:6379
    networks:
      - mcs-network
  redisinsight:
    image: redislabs/redisinsight:2.66
    container_name: mcs-redisinsight
    restart: unless-stopped
    volumes:
      - ./data/redis-insight:/data
    depends_on:
      - redis
    ports:
      - 5540:5540
    networks:
      - mcs-network
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: mcs-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${ML_API_KEY:-ms}
    volumes:
      - mls_data:/data.ms
    ports:
      - "7700:7700" # Change ports if needed
    networks:
      - mcs-network
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: mcs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_SERVERS: zookeeper:2888:3888
    ports:
      - "2181:2181"
    networks:
      - mcs-network
  kafka1:
    image: confluentinc/cp-kafka:7.9.0
    container_name: mcs-kafka1
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    networks:
      - mcs-network
